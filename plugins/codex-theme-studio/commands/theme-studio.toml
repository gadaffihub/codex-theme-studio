description = "Open the terminal-native Codex and Claude theme editor"
prompt = "Open terminal-native Theme Studio. From this plugin's root, run `scripts/theme-studio.sh --agent {{args}}`; default to the saved preference, initially `window`. Launch modes are `--window`, `--tab`, and `--overlay`; products are `--codex` and `--claude`; persist a preference with `--set-default window|tab|overlay`. Keep the `--agent` guard: window and tab return immediately without sending input or signals to the live agent; overlay becomes a window because plugins cannot insert an external widget into Codex's private Ctrl+T overlay. Tell users that direct-shell `scripts/theme-studio.sh --overlay` uses the same alternate-screen enter/restore lifecycle. Report where Theme Studio opened."
